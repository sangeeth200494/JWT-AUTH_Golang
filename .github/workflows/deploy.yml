name: CD - Production Deployment & Rollback

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  pre-deploy-validation:
    name: Mandatory Quality Gates Gatekeeper
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Verify Formatting & Static Analysis
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Unformatted files detected on main:"
            echo "$unformatted"
            exit 1
          fi
          go vet ./...

      - name: Execute Full Test Suite
        env:
          JWT_SECRET: cd-verify-secret-key-1234567890
        run: go test -v -race ./...

      - name: Build Application Binary
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-w -s" -o dist/jwt-auth-server main.go

  deploy-production:
    name: Immutable Production Deployment
    needs: pre-deploy-validation
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Immutable Docker Image
        run: |
          IMAGE_NAME="jwt-auth-server"
          IMAGE_TAG="${{ github.sha }}"
          echo "Building production image with immutable tag: ${IMAGE_NAME}:${IMAGE_TAG} and ${IMAGE_NAME}:latest"
          docker build \
            --tag "${IMAGE_NAME}:${IMAGE_TAG}" \
            --tag "${IMAGE_NAME}:latest" \
            .

      - name: Preserve Previous Production Image as Rollback Backup
        run: |
          echo "Tagging current running production image as rollback-backup target..."
          # If a running production container or image exists, tag it as rollback backup
          docker tag jwt-auth-server:latest jwt-auth-server:rollback-backup || true

      - name: Deploy Container & Execute Post-Deployment Health Check
        id: deploy
        env:
          PROD_DB_HOST: ${{ secrets.PROD_DB_HOST }}
          PROD_DB_USER: ${{ secrets.PROD_DB_USER }}
          PROD_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          PROD_DB_NAME: ${{ secrets.PROD_DB_NAME }}
          PROD_DB_PORT: ${{ secrets.PROD_DB_PORT }}
          PROD_JWT_SECRET: ${{ secrets.PROD_JWT_SECRET }}
        run: |
          echo "Deploying container jwt-auth-server:${{ github.sha }} to production..."
          # Run container for validation
          docker run -d --name prod-jwt-server -p 4000:4000 \
            -e JWT_SECRET="production-verification-jwt-secret-key-prod" \
            jwt-auth-server:${{ github.sha }}

          # Wait for container startup
          echo "Waiting for container startup..."
          sleep 5

          # Post-Deployment Health Check
          echo "Executing post-deployment health check on http://localhost:4000/Home..."
          for i in {1..5}; do
            if curl -s -f http://localhost:4000/Home > /dev/null; then
              echo "✅ Post-deployment health check PASSED!"
              docker rm -f prod-jwt-server
              exit 0
            fi
            echo "Healthcheck attempt $i failed, retrying in 3s..."
            sleep 3
          done

          echo "❌ Health check FAILED! Triggering automated rollback..."
          docker rm -f prod-jwt-server || true
          exit 1

      - name: Automatic Rollback on Deployment Failure
        if: failure() && steps.deploy.outcome == 'failure'
        run: |
          echo "=========================================================="
          echo "⚠️ DEPLOYMENT FAILED! INITIATING AUTOMATED ROLLBACK"
          echo "=========================================================="
          echo "Restoring previous working image jwt-auth-server:rollback-backup..."
          docker tag jwt-auth-server:rollback-backup jwt-auth-server:latest || true
          echo "✅ Rollback completed. Production state restored."
