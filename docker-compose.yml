services:
  postgres:
    image: postgres:16-alpine
    container_name: jwt_auth_postgres
    restart: always
    environment:
      POSTGRES_DB: jwt_auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"
    volumes:
      - jwt_auth_volume:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jwt_auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  jwt_auth_volume:
    name: jwt_auth_volume
